baseURL = 'https://terryhu.cn/'
defaultContentLanguage = "en"
languageCode = "zh-Hans"
title = "Terry's Blog"
theme = "dream"

enableGitInfo = true
enableRobotsTXT = true
hasCJKLanguage = true

# 性能优化
timeout = "30s"
enableInlineShortcodes = true

[imaging]
  resampleFilter = "Lanczos"
  quality = 85
  anchor = "Smart"

[services]
  [services.disqus]
    shortname = "tianyu_hu"
  [services.googleAnalytics]
    ID = "12095195484"

[permalinks]
  posts = "/posts/:year/:slug/"

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false

[params]
  lightTheme = "emerald"
  darkTheme = "forest"

  backgroundImage = "/img/bridge.jpg"
  backgroundImageDark = ""
  favicon = "/img/avatar.ico"
  avatar = "/img/avatar.jpg"
  headerTitle = "Terry's Blog"
  motto = "S'all good!"
  rss = true

  email = "huty1998@outlook.com"
  siteStartYear = 2025

  # options
  stickyNav = true
  reorderNavItems = ["about", "search", "github", "posts", "categories", "tags", "rss"]
  collapseNavItems = ["posts", "categories", "tags", "rss"]
  showTableOfContents = true
  showSummaryCoverInPost = false
  imageZoomableInPost = true
  showPrevNextPost = true
  #reorderShares = ["x"]

  [params.social]
    twitter = "21Terrence1"

  [params.navItems]
    github = { href = "https://github.com/terryHu7", target = "_blank", icon = "logo-github", title = "GitHub" }

  [params.advanced]
    customCSS = ["css/custom.css"]
    customJS = ["js/lazy-load.js"]

# 缓存配置
[caches]
  [caches.getjson]
    maxAge = "10m"
  [caches.getcsv]
    maxAge = "10m"
  [caches.images]
    maxAge = "1h"
  [caches.assets]
    maxAge = "1h"

# 压缩配置
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      keepCSS2 = true
      precision = 0
    [minify.tdewolff.js]
      keepVarNames = false
      precision = 0

  # [params.experimental]
  #   jsDate = true
  #   jsDateFormat = "yyyy年MM月dd日"